name: Run Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      PROJECT_NAME: "fastapi_setup"
      VERSION: "0.1.0"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: "project_db"
      DB_HOST: "localhost"
      DB_PORT: "5432"
      JWT_SECRET_KEY: "dummy-secret-key-for-github-actions-only"
      JWT_ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: "15"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      GOOGLE_CLIENT_ID: "dummy_google_id"
      GOOGLE_CLIENT_SECRET: "dummy_google_secret"
      GITHUB_CLIENT_ID: "dummy_github_id"
      GITHUB_CLIENT_SECRET: "dummy_github_secret"
      BACKEND_CORS_ORIGINS: '["http://localhost:3000"]'
      MAIL_HOST: "smtp.example.com"
      MAIL_USERNAME: "test@example.com"
      MAIL_PASSWORD: "testpassword"
      MAIL_PORT: "587"
      MAIL_FROM: "dev@test.com"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest